name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 app.py entities --max-line-length=100

  docker:
    name: Build y prueba con Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear .env a partir de .env.example
        run: cp .env.example .env

      - name: Construir y levantar contenedores
        run: docker compose up -d --build

      - name: Esperar a que la app responda
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/ > /dev/null; then
              echo "App arriba"; exit 0
            fi
            sleep 3
          done
          echo "La app no respondio a tiempo"
          docker compose logs
          exit 1

      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs

      - name: Apagar contenedores
        if: always()
        run: docker compose down -v